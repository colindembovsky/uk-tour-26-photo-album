  - id: belfast
    name: Belfast
    dates: 7–8 October
    history: >
      Belfast takes its name from Béal Feirste, "the mouth of the sandbank
      ford", where the little River Farset met the Lagan. It was a modest town
      until the 1800s, when linen, rope-making and shipbuilding turned it into
      an industrial powerhouse. By 1900 Harland & Wolff was the largest
      shipyard in the world, and in 1911 it launched the Titanic. After the
      hard decades of the Troubles, the old docks have become the Titanic
      Quarter, and the Albert Memorial Clock still leans gently over the city
      centre.
