        caption: First Guinness on the island of Ireland.
      - file: 20261008_124947.jpg
        caption: You just can't beat Nandos.

  - id: dublin
    name: Dublin
    dates: 9 October
    history: >
      Vikings founded Dublin in the 840s beside Dubh Linn, the "black pool"
      where the River Poddle met the Liffey. Christ Church Cathedral rose on
      their settlement, and St Patrick's followed nearby. Georgian Dublin came
      next, with its grand quays and James Gandon's green-domed Custom House.
      In 1759 Arthur Guinness signed a 9,000-year lease on a brewery at St
      James's Gate, which is why a pint here tastes like history. In 1922 Dublin
      became the capital of an independent Ireland.
