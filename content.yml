# Album copy. Edit freely, then run `npm run build`.
#
# - Photos appear in the order listed here.
# - New files dropped into photos/<city>/ are appended automatically
#   (by capture time) with an empty caption the next time you build.
# - Add `hide: true` to leave a photo out without deleting it.
# - Lines marked "CHECK" are guesses I couldn't confirm from the photo.
# - Every photo is signed bottom-right (or bottom-left if calmer). Override
#   per photo with `signature: left|right|none` and/or `ink: black|white`.

title: Four Cities
subtitle: Edinburgh, London, Belfast & Dublin
dates: October 2026

chapters:
  - id: edinburgh
    name: Edinburgh
    dates: 4–5 October
    history: >
      Edinburgh grew along a ridge of old volcanic rock, with a castle at one
      end, a royal palace at the other, and the Royal Mile running between
      them. By the 1700s the crowded Old Town was bursting at the seams, so the
      city built the orderly Georgian streets of the New Town across the valley
      and became the "Athens of the North": home of the Scottish Enlightenment,
      of David Hume and Adam Smith, and of the Greek-temple monuments that crown
      Calton Hill. Scotland's capital for more than five hundred years, it still
      wears its history on every stone.
