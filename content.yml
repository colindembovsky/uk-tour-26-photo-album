  - id: london
    name: London
    dates: 6–7 October
    history: >
      The Romans founded Londinium on the Thames almost two thousand years
      ago, and the square mile they walled is still the City of London. The
      city survived plague and the Great Fire of 1666, after which Christopher
      Wren rebuilt more than fifty churches and St Paul's Cathedral, whose dome
      has watched over London since the early 1700s. Today glass towers crowd
      around Wren's spires, Nelson keeps watch over Trafalgar Square, and the
      old and the new share every street.
